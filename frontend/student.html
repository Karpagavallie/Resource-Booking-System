
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - Resource Booking System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="dashboard-container">

    <div class="dashboard-header">
      <h1>Student Dashboard</h1>
      <div class="header-right">
        <span>Welcome, <strong id="userName"></strong></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="dashboard-grid">

      <div class="card">
        <h2>Book Resource</h2>

        <div class="form-group">
          <label for="resourceSelect">Select Resource</label>
          <select id="resourceSelect">
            <option value="">-- Select Resource --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Select Date</label>
          <input type="date" id="date" />
        </div>

        <div class="form-group">
          <label for="time">Select Time</label>
          <input type="time" id="time" />
        </div>

        <button class="primary-btn" onclick="bookResource()">Book Now</button>
      </div>

      <div class="card">
        <h2>My Booking History</h2>
        <div class="table-wrapper">
          <table id="historyTable">
            <thead>
              <tr>
                <th>Resource</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script src="student.js"></script>
</body>
</html>
